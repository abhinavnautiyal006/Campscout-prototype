<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampScout - Campus Navigation & Hostel Guide</title>
  
  <!-- Mapbox GL JS CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); }

    /* Layout */
    #sidebar { width: 380px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 2; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
    #map-container { flex: 1; position: relative; height: 100%; }
    #map { width: 100%; height: 100%; }

    /* Header */
    .header { padding: 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    /* Controls */
    .controls { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 500; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }

    /* POI List */
    .poi-list { flex: 1; overflow-y: auto; padding: 15px 20px; }
    .poi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
    .poi-card:hover { border-color: var(--primary); transform: translateY(-1px); }
    .poi-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .poi-tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; background: #e0e7ff; color: #3730a3; font-weight: 600; }
    .poi-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; display: flex; gap: 12px; }

    /* Detail Drawer Modal */
    #detail-drawer { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.3s ease-in-out; z-index: 10; max-height: 80%; overflow-y: auto; }
    #detail-drawer.active { transform: translateY(0); }
    .drawer-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
    .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
    .badge { display: inline-block; background: #fef3c7; color: #92400e; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: 600; margin-bottom: 10px; }
    
    /* Indoor Map Modal */
    #indoor-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
    #indoor-modal.active { display: flex; }
    .indoor-content { background: var(--surface); width: 90%; max-width: 650px; border-radius: 12px; padding: 20px; position: relative; }
    .floor-controls { display: flex; gap: 8px; margin: 15px 0; }
    .floor-btn { padding: 6px 12px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; }
    .floor-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .blueprint-viewport { width: 100%; height: 280px; background: #0f172a; border-radius: 8px; border: 2px dashed #334155; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-family: monospace; position: relative; overflow: hidden; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: 45vh; }
      #map-container { height: 55vh; }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div id="sidebar">
    <div class="header">
      <h1>🗺️ CampScout</h1>
      <p>Interactive Campus Navigation & Resident Guide</p>
    </div>
    
    <div class="controls">
      <button class="btn" id="btn-gps">📍 Nearby Me</button>
      <button class="btn btn-secondary" onclick="resetView()">Reset Map</button>
    </div>

    <div class="poi-list" id="poi-list">
      <!-- POI cards rendered dynamically -->
    </div>
  </div>

  <!-- Map Viewport -->
  <div id="map-container">
    <div id="map"></div>

    <!-- Location Detail Drawer -->
    <div id="detail-drawer">
      <div class="drawer-header">
        <div>
          <span class="badge" id="drawer-category">Category</span>
          <h2 id="drawer-title">Location Name</h2>
        </div>
        <button class="close-btn" onclick="closeDrawer()">&times;</button>
      </div>
      <p id="drawer-desc" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;"></p>
      
      <div style="margin-bottom: 15px;">
        <p style="font-size: 0.85rem; font-weight: 600;">✨ What's Special:</p>
        <p id="drawer-special" style="font-size: 0.85rem; color: #334155; margin-top: 4px;"></p>
      </div>

      <div style="margin-bottom: 15px; display: flex; gap: 20px;">
        <div>
          <span style="font-size: 0.75rem; color: var(--text-muted);">Rating</span>
          <p id="drawer-rating" style="font-weight: bold; color: #d97706;">★ 0.0</p>
        </div>
        <div>
          <span style="font-size: 0.75rem; color: var(--text-muted);">Hours</span>
          <p id="drawer-hours" style="font-weight: 500; font-size: 0.85rem;">-</p>
        </div>
      </div>

      <button class="btn" style="width: 100%;" onclick="openIndoorViewer()">🗺️ View Indoor Floor Layout</button>
    </div>
  </div>

  <!-- Indoor Layout Modal -->
  <div id="indoor-modal">
    <div class="indoor-content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="indoor-title">Floor Blueprint</h3>
        <button class="close-btn" onclick="closeIndoorViewer()">&times;</button>
      </div>

      <div class="floor-controls">
        <button class="floor-btn active" onclick="switchFloor('Ground Floor')">Ground</button>
        <button class="floor-btn" onclick="switchFloor('1st Floor')">Floor 1</button>
        <button class="floor-btn" onclick="switchFloor('2nd Floor')">Floor 2</button>
      </div>

      <div class="blueprint-viewport" id="blueprint-display">
        [ Ground Floor Layout: Main Entrance | Restrooms (East) | Elevator (Center) ]
      </div>
    </div>
  </div>

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script>
    // ⚠️ Replace with your actual Mapbox Public Access Token
    mapboxgl.accessToken = 'YOUR_MAPBOX_ACCESS_TOKEN';

    // Campus Base Center (e.g., IIT Roorkee area coordinates)
    const CAMPUS_CENTER = [77.8966, 29.8649];

    // Mock Campus Dataset
    const CAMPUS_DATA = [
      {
        id: '1',
        name: 'Rajendra Bhawan (Hostel)',
        category: 'Hostel',
        coordinates: [77.8945, 29.8660],
        rating: '4.5',
        hours: '24/7 Access',
        description: 'Primary residential hostel for senior undergraduates with integrated mess facilities.',
        special: 'Famous for the late-night canteen and spacious quadrangle lawn.',
        indoorLayouts: {
          'Ground Floor': '[ Ground Floor: Mess Hall | Warden Office | Common Room | Cycle Park ]',
          '1st Floor': '[ 1st Floor: Rooms 101-145 | Washrooms (North Wing) | Study Lounge ]',
          '2nd Floor': '[ 2nd Floor: Rooms 201-245 | Washrooms (North Wing) | TT Table Area ]'
        }
      },
      {
        id: '2',
        name: 'Central Library',
        category: 'Academic',
        coordinates: [77.8975, 29.8640],
        rating: '4.8',
        hours: '08:00 AM - 12:00 AM',
        description: 'Multi-story central library with thousands of technical journals and quiet reading areas.',
        special: 'Air-conditioned 3rd-floor reading zone with high-speed Wi-Fi and power outlets.',
        indoorLayouts: {
          'Ground Floor': '[ Ground Floor: Circulation Desk | Issue Counters | Digital Archival Lab ]',
          '1st Floor': '[ 1st Floor: Stack Area (Computer Science & Electrical) | Reading Pods ]',
          '2nd Floor': '[ 2nd Floor: Quiet Study Zone | Reference Books Section | Restrooms ]'
        }
      },
      {
        id: '3',
        name: 'Main Building / Administrative Block',
        category: 'Administrative',
        coordinates: [77.8966, 29.8649],
        rating: '4.9',
        hours: '09:00 AM - 05:30 PM',
        description: 'Iconic historic administrative center housing the Dean and Director offices.',
        special: 'Beautiful heritage architecture; landmark photo spot for campus visitors.',
        indoorLayouts: {
          'Ground Floor': '[ Ground Floor: Academic Section | Registrar Office | Main Lawn Entrance ]',
          '1st Floor': '[ 1st Floor: Director Office | Conference Hall A & B ]',
          '2nd Floor': '[ 2nd Floor: Administrative Records & Archives ]'
        }
      }
    ];

    let selectedPoi = null;

    // Initialize Mapbox Engine
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: CAMPUS_CENTER,
      zoom: 15.5
    });

    // Add Navigation & Geolocation Controls
    map.addControl(new mapboxgl.NavigationControl());
    
    const geolocateControl = new mapboxgl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    });
    map.addControl(geolocateControl);

    // Initialize Application Data
    map.on('load', () => {
      renderPoiList();
      addCampusMarkers();
    });

    // Render Sidebar List
    function renderPoiList() {
      const listContainer = document.getElementById('poi-list');
      listContainer.innerHTML = '';

      CAMPUS_DATA.forEach(poi => {
        const card = document.createElement('div');
        card.className = 'poi-card';
        card.onclick = () => selectLocation(poi);
        card.innerHTML = `
          <div class="poi-title">
            ${poi.name}
            <span class="poi-tag">${poi.category}</span>
          </div>
          <div class="poi-meta">
            <span>★ ${poi.rating}</span>
            <span>🕒 ${poi.hours}</span>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // Add Markers to Mapbox Map
    function addCampusMarkers() {
      CAMPUS_DATA.forEach(poi => {
        const marker = new mapboxgl.Marker({ color: '#2563eb' })
          .setLngLat(poi.coordinates)
          .addTo(map);

        marker.getElement().addEventListener('click', () => {
          selectLocation(poi);
        });
      });
    }

    // Focus Selected Location
    function selectLocation(poi) {
      selectedPoi = poi;

      map.flyTo({
        center: poi.coordinates,
        zoom: 17,
        pitch: 45,
        essential: true
      });

      // Populate Drawer
      document.getElementById('drawer-title').innerText = poi.name;
      document.getElementById('drawer-category').innerText = poi.category;
      document.getElementById('drawer-desc').innerText = poi.description;
      document.getElementById('drawer-special').innerText = poi.special;
      document.getElementById('drawer-rating').innerText = `★ ${poi.rating}`;
      document.getElementById('drawer-hours').innerText = poi.hours;

      // Open Drawer
      document.getElementById('detail-drawer').classList.add('active');
    }

    // Drawer Controls
    function closeDrawer() {
      document.getElementById('detail-drawer').classList.remove('active');
    }

    function resetView() {
      closeDrawer();
      map.flyTo({ center: CAMPUS_CENTER, zoom: 15.5, pitch: 0 });
    }

    // GPS Trigger Button
    document.getElementById('btn-gps').addEventListener('click', () => {
      geolocateControl.trigger();
    });

    // Indoor Layout Viewer Functions
    function openIndoorViewer() {
      if (!selectedPoi) return;
      document.getElementById('indoor-title').innerText = `${selectedPoi.name} - Floor Plan`;
      switchFloor('Ground Floor');
      document.getElementById('indoor-modal').classList.add('active');
    }

    function closeIndoorViewer() {
      document.getElementById('indoor-modal').classList.remove('active');
    }

    function switchFloor(floorName) {
      // Update UI buttons
      const buttons = document.querySelectorAll('.floor-btn');
      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(floorName.replace(' Floor', '').replace('st', '').replace('nd', '')));
      });

      // Update Blueprint Text Screen
      if (selectedPoi && selectedPoi.indoorLayouts[floorName]) {
        document.getElementById('blueprint-display').innerText = selectedPoi.indoorLayouts[floorName];
      }
    }
  </script>
</body>
</html>
